# Development Environment - Gateway Only
# Use this for local development with hot-reload
#
# Usage:
#   1. docker compose -f docker-compose.dev.yml up -d
#   2. ./scripts/dev.sh (starts local frontend + backend)

name: openclaw-voice-dev

services:
  # ===========================================
  # OpenClaw Gateway (Independent Instance)
  # ===========================================
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      TZ: ${OPENCLAW_TZ:-Asia/Shanghai}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-openclaw-your-gateway-token-here}
      ALI_BAILIAN_API_KEY: ${ALI_BAILIAN_API_KEY:-sk-your-api-key-here}
      OPENCLAW_DEFAULT_MODEL: ${OPENCLAW_DEFAULT_MODEL:-bailian/qwen3-coder-next}
      OPENCLAW_GATEWAY_ALLOW_UNCONFIGURED: "true"
      OPENCLAW_CONTROL_UI_DANGEROUSLY_ALLOW_HOST_HEADER_ORIGIN_FALLBACK: "true"
      OPENCLAW_GATEWAY_MODE: "local"
      OPENCLAW_GATEWAY_BIND: lan
    volumes:
      - openclaw-gateway-config:/home/node/.openclaw
    ports:
      - "26523:18789"
      - "26524:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--allow-unconfigured",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - openclaw-voice-network

  # ===========================================
  # OpenClaw CLI
  # ===========================================
  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    network_mode: "service:openclaw-gateway"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-openclaw-your-gateway-token-here}
      BROWSER: echo
      TZ: ${OPENCLAW_TZ:-Asia/Shanghai}
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      - openclaw-gateway

networks:
  openclaw-voice-network:
    driver: bridge

volumes:
  openclaw-gateway-config:
