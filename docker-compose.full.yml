version: '3.8'

services:
  # OpenClaw Gateway Service
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-gateway
    ports:
      - "18789:18789"
    environment:
      - OPENCLAW_PORT=18789
      - OPENCLAW_HOST=0.0.0.0
      - OPENCLAW_DEFAULT_MODEL=bailian/qwen3-coder-next
    volumes:
      - type: bind
        source: ./openclaw-gateway-config
        target: /home/node/.openclaw
        read_only: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # OpenClaw Voice Service
  openclaw-voice-bailian:
    build:
      context: .
      dockerfile: Dockerfile.bailian
    ports:
      - "8765:8765"
    environment:
      - ALI_BAILIAN_API_KEY=YOUR_BAILIAN_API_KEY
      - OPENCLAW_STT_MODEL=qwen3-asr-flash
      - OPENCLAW_STT_LANGUAGE=zh
      - OPENCLAW_TTS_MODEL=qwen3-tts-flash
      - OPENCLAW_TTS_VOICE=Cherry
      - OPENCLAW_TTS_LANGUAGE=Chinese
      - OPENCLAW_GATEWAY_URL=http://openclaw-gateway:18789
      - OPENCLAW_GATEWAY_TOKEN=YOUR_GATEWAY_TOKEN
    depends_on:
      openclaw-gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  openclaw-gateway-data:
