# OpenClaw Voice - Full Stack Deployment (Gateway + Voice)
# Self-contained deployment - does NOT mount host OpenClaw config
# Usage: docker compose -f docker-compose.full.yml -p openclaw-voice up -d

name: openclaw-voice

services:
  # ===========================================
  # OpenClaw Gateway (Isolated Instance)
  # ===========================================
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      TZ: ${OPENCLAW_TZ:-Asia/Shanghai}
      # Gateway authentication
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-REDACTED-openclaw-voice-token}
      # Bailian API Key for models
      ALI_BAILIAN_API_KEY: ${ALI_BAILIAN_API_KEY:-REDACTED-gateway-provider-key}
      # Model configuration
      OPENCLAW_DEFAULT_MODEL: ${OPENCLAW_DEFAULT_MODEL:-bailian/qwen3-coder-next}
    volumes:
      # Use isolated volume - NOT host config
      - openclaw-gateway-data:/home/node/.openclaw
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - openclaw-voice-network

  # ===========================================
  # OpenClaw Voice (Bailian STT/TTS)
  # ===========================================
  openclaw-voice:
    build:
      context: .
      dockerfile: Dockerfile.bailian
    environment:
      # Bailian API (STT + TTS)
      - ALI_BAILIAN_API_KEY=${ALI_BAILIAN_API_KEY:-REDACTED-gateway-provider-key}
      # STT Configuration
      - OPENCLAW_STT_MODEL=qwen3-asr-flash
      - OPENCLAW_STT_LANGUAGE=zh
      # TTS Configuration
      - OPENCLAW_TTS_MODEL=qwen3-tts-flash
      - OPENCLAW_TTS_VOICE=Cherry
      - OPENCLAW_TTS_LANGUAGE=Chinese
      # Gateway Connection (same network, use service name)
      - OPENCLAW_GATEWAY_URL=http://openclaw-gateway:18789
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-REDACTED-openclaw-voice-token}
    ports:
      - "${OPENCLAW_VOICE_PORT:-8765}:8765"
    depends_on:
      openclaw-gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - openclaw-voice-network

networks:
  openclaw-voice-network:
    driver: bridge

volumes:
  # Isolated volume for Gateway data - does NOT touch host config
  openclaw-gateway-data:
