# OpenClaw Voice - Full Stack Docker Compose
#
# Usage:
#   1. Edit .env.docker with your API keys
#   2. Optionally override port mappings in .env.docker:
#      - OPENCLAW_GATEWAY_PORT: Gateway external port (default: 18789)
#      - OPENCLAW_VOICE_PORT: Voice external port (default: 8765)
#   3. ./start.sh docker up

name: openclaw-voice

services:
  # ===========================================
  # OpenClaw Gateway
  # ===========================================
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:latest
    volumes:
      # Bind mount: Gateway configuration (easy to edit)
      - /home/ztmdsbt/voice-agent-data/gateway-config:/home/node/.openclaw
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet --tries=1 --timeout=5 http://localhost:18789/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ===========================================
  # OpenClaw Voice (Bailian STT/TTS/LLM)
  # Built from local source code
  # ===========================================
  openclaw-voice:
    depends_on:
      openclaw-gateway:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    environment:
      - OPENCLAW_GATEWAY_PORT=${OPENCLAW_GATEWAY_PORT:-18789}
      - OPENCLAW_VOICE_PORT=${OPENCLAW_VOICE_PORT:-8765}
    ports:
      - "${OPENCLAW_VOICE_PORT:-8765}:8765"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8765/\")'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
