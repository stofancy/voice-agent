# OpenClaw Voice - Production Docker Compose
# Three-container architecture: Gateway + Backend + Frontend

name: openclaw-voice

services:
  # ===========================================
  # OpenClaw Gateway
  # ===========================================
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      TZ: ${OPENCLAW_TZ:-Asia/Shanghai}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-openclaw-your-gateway-token-here}
      ALI_BAILIAN_API_KEY: ${ALI_BAILIAN_API_KEY:-sk-your-api-key-here}
      OPENCLAW_DEFAULT_MODEL: ${OPENCLAW_DEFAULT_MODEL:-bailian/qwen3-coder-next}
      OPENCLAW_GATEWAY_ALLOW_UNCONFIGURED: "true"
      OPENCLAW_CONTROL_UI_DANGEROUSLY_ALLOW_HOST_HEADER_ORIGIN_FALLBACK: "true"
      OPENCLAW_GATEWAY_MODE: "local"
      OPENCLAW_GATEWAY_BIND: lan
    volumes:
      - openclaw-gateway-config:/home/node/.openclaw
    ports:
      - "26523:18789"
      - "26524:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--allow-unconfigured",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - openclaw-voice-network

  # ===========================================
  # OpenClaw CLI
  # ===========================================
  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    network_mode: "service:openclaw-gateway"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-openclaw-your-gateway-token-here}
      BROWSER: echo
      TZ: ${OPENCLAW_TZ:-Asia/Shanghai}
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      - openclaw-gateway

  # ===========================================
  # Voice Backend (FastAPI)
  # ===========================================
  openclaw-voice-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - ALI_BAILIAN_API_KEY=${ALI_BAILIAN_API_KEY:-sk-your-api-key-here}
      - OPENCLAW_STT_MODEL=${OPENCLAW_STT_MODEL:-qwen3-asr-flash}
      - OPENCLAW_STT_LANGUAGE=${OPENCLAW_STT_LANGUAGE:-zh}
      - OPENCLAW_TTS_MODEL=${OPENCLAW_TTS_MODEL:-qwen3-tts-flash}
      - OPENCLAW_TTS_VOICE=${OPENCLAW_TTS_VOICE:-Cherry}
      - OPENCLAW_TTS_LANGUAGE=${OPENCLAW_TTS_LANGUAGE:-Chinese}
      - OPENCLAW_GATEWAY_URL=http://openclaw-gateway:18789
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-openclaw-your-gateway-token-here}
    ports:
      - "${OPENCLAW_BACKEND_PORT:-8765}:8765"
    depends_on:
      openclaw-gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - openclaw-voice-network

  # ===========================================
  # Voice Frontend (Nginx)
  # ===========================================
  openclaw-voice-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${OPENCLAW_FRONTEND_PORT:-8764}:80"
    depends_on:
      - openclaw-voice-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - openclaw-voice-network

networks:
  openclaw-voice-network:
    driver: bridge

volumes:
  openclaw-gateway-config:
