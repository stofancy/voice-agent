<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00D4FF">
    <title>OpenClaw Voice v2.0</title>
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animation.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/mobile.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body>
    <!-- Top Bar -->
    <header class="top-bar" id="topBar">
        <h1 class="title">OpenClaw Voice</h1>
    </header>
    
    <!-- Main Content -->
    <main class="main-content">
        <!-- Conversation Area -->
        <div class="conversation-area" id="conversationArea">
            <div class="messages-container" id="messagesContainer">
                <!-- Messages will be inserted here -->
                <div class="message assistant">
                    <div class="message-content">
                        <span class="message-sender">🤖 AI</span>
                        <p class="message-text">你好！我是你的语音助手。点击下方的 TALK 按钮开始对话吧！</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Control Area -->
        <div class="control-area">
            <!-- Continuous Mode Toggle -->
            <button class="mode-toggle" id="continuousModeBtn" aria-label="连续对话模式" title="连续对话模式">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M17 2l4 4-4 4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M3 11v-1a4 4 0 014-4h14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M7 22l-4-4 4-4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M21 13v1a4 4 0 01-4 4H3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>连续</span>
            </button>
            
            <!-- Interrupt Button -->
            <button class="interrupt-btn" id="interruptBtn" aria-label="打断 AI" style="display: none;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <rect x="4" y="4" width="16" height="16" rx="2" stroke-width="2"/>
                    <line x1="4" y1="12" x2="20" y2="12" stroke-width="2"/>
                </svg>
                <span>打断</span>
            </button>
            
            <!-- Talk Button -->
            <button class="talk-btn" id="talkBtn" aria-label="开始说话">
                <div class="talk-btn-content">
                    <svg class="mic-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" stroke-width="2"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2" stroke-width="2"/>
                        <line x1="12" y1="19" x2="12" y2="23" stroke-width="2"/>
                        <line x1="8" y1="23" x2="16" y2="23" stroke-width="2"/>
                    </svg>
                    <span class="talk-text">TALK</span>
                </div>
                <div class="sound-waves">
                    <div class="wave"></div>
                    <div class="wave"></div>
                    <div class="wave"></div>
                    <div class="wave"></div>
                    <div class="wave"></div>
                </div>
            </button>
            
            <!-- History Button -->
            <button class="history-btn" id="historyBtn" aria-label="历史记录">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="12" cy="12" r="10" stroke-width="2"/>
                    <polyline points="12 6 12 12 16 14" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            
            <!-- Clear History Button -->
            <button class="clear-btn" id="clearHistoryBtn" aria-label="清除历史">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <polyline points="3 6 5 6 21 6" stroke-width="2" stroke-linecap="round"/>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke-width="2"/>
                    <line x1="10" y1="11" x2="10" y2="17" stroke-width="2" stroke-linecap="round"/>
                    <line x1="14" y1="11" x2="14" y2="17" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
    </main>
    
    <!-- User Speaking Indicator -->
    <div class="user-speaking-indicator" id="userSpeakingIndicator" style="display: none;">
        <div class="indicator-content">
            <div class="waveform">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            <span>正在听你说话...</span>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="js/sanitize.js?v=202603241200"></script>
    <script src="components/blocks/TextBlock.js?v=202603241200"></script>
    <script src="components/blocks/ImageBlock.js?v=202603241200"></script>
    <script src="components/blocks/LinkBlock.js?v=202603241200"></script>
    <script src="components/blocks/VideoBlock.js?v=202603241200"></script>
    <script src="components/blocks/HtmlBlock.js?v=202603241200"></script>
    <script src="components/MessageBubble.js?v=202603241200"></script>
    <script src="components/TalkButton.js?v=202603241200"></script>
    <script src="components/InterruptButton.js?v=202603241200"></script>
    <script src="js/vad.js?v=202603241200"></script>
    <script src="js/tts.js?v=202603241200"></script>
    <script src="js/ui.js?v=202603241200"></script>
    <script src="js/app.js?v=202603241200"></script>
</body>
</html>
