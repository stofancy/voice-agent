<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00D4FF">
    <title>OpenClaw Voice v2.0</title>
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animation.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/mobile.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body>
    <!-- Top Bar -->
    <header class="top-bar" id="topBar">
        <button class="menu-btn" id="menuBtn" aria-label="菜单">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M3 12h18M3 6h18M3 18h18" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>
        <h1 class="title">OpenClaw Voice</h1>
        <div class="actions">
            <button class="icon-btn" id="settingsBtn" aria-label="设置">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="12" cy="12" r="3" stroke-width="2"/>
                    <path d="M12 1v6m0 6v6m11-7h-6m-6 0H1m15.5-6.5l-4.5 4.5m-4 4l-4.5 4.5m0-9l4.5 4.5m4 4l4.5 4.5" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
    </header>
    
    <!-- Main Content -->
    <main class="main-content">
        <!-- Conversation Area -->
        <div class="conversation-area" id="conversationArea">
            <div class="messages-container" id="messagesContainer">
                <!-- Messages will be inserted here -->
                <div class="message assistant">
                    <div class="message-content">
                        <span class="message-sender">🤖 AI</span>
                        <p class="message-text">你好！我是你的语音助手。点击下方的 TALK 按钮开始对话吧！</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Control Area -->
        <div class="control-area">
            <!-- Interrupt Button -->
            <button class="interrupt-btn" id="interruptBtn" aria-label="打断 AI" style="display: none;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <rect x="4" y="4" width="16" height="16" rx="2" stroke-width="2"/>
                    <line x1="4" y1="12" x2="20" y2="12" stroke-width="2"/>
                </svg>
                <span>打断</span>
            </button>
            
            <!-- Talk Button -->
            <button class="talk-btn" id="talkBtn" aria-label="开始说话">
                <div class="talk-btn-content">
                    <svg class="mic-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" stroke-width="2"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2" stroke-width="2"/>
                        <line x1="12" y1="19" x2="12" y2="23" stroke-width="2"/>
                        <line x1="8" y1="23" x2="16" y2="23" stroke-width="2"/>
                    </svg>
                    <span class="talk-text">TALK</span>
                </div>
                <div class="sound-waves">
                    <div class="wave"></div>
                    <div class="wave"></div>
                    <div class="wave"></div>
                    <div class="wave"></div>
                    <div class="wave"></div>
                </div>
            </button>
            
            <!-- History Button -->
            <button class="history-btn" id="historyBtn" aria-label="历史记录">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="12" cy="12" r="10" stroke-width="2"/>
                    <polyline points="12 6 12 12 16 14" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
    </main>
    
    <!-- User Speaking Indicator -->
    <div class="user-speaking-indicator" id="userSpeakingIndicator" style="display: none;">
        <div class="indicator-content">
            <div class="waveform">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            <span>正在听你说话...</span>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="js/sanitize.js"></script>
    <script src="components/blocks/TextBlock.js"></script>
    <script src="components/blocks/ImageBlock.js"></script>
    <script src="components/blocks/LinkBlock.js"></script>
    <script src="components/blocks/VideoBlock.js"></script>
    <script src="components/blocks/HtmlBlock.js"></script>
    <script src="components/MessageBubble.js"></script>
    <script src="components/TalkButton.js"></script>
    <script src="components/InterruptButton.js"></script>
    <script src="js/vad.js"></script>
    <script src="js/tts.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
