services:
  xihe-voice:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        - HTTP_PROXY=http://192.168.0.147:7890
        - HTTPS_PROXY=http://192.168.0.147:7890
        - NO_PROXY=localhost,127.0.0.1,.local
    image: xihe-voice-plugin:latest
    container_name: xihe-voice-plugin
    environment:
      - ALI_BAILIAN_API_KEY=${ALI_BAILIAN_API_KEY:-sk-your-api-key-here}
      - NODE_ENV=production
      - HTTP_PROXY=http://192.168.0.147:7890
      - HTTPS_PROXY=http://192.168.0.147:7890
    ports:
      - "${WEBUI_PORT:-5182}:5173"
      - "${WS_PORT:-8774}:8765"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:18789/__openclaw__/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - xihe-voice-network
    volumes:
      # 持久化 OpenClaw 配置
      - xihe-voice-data:/home/node/.openclaw
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  xihe-voice-network:
    driver: bridge

volumes:
  xihe-voice-data:
    driver: local
